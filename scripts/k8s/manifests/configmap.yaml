apiVersion: v1
kind: ConfigMap
metadata:
  name: alisio-config
  labels:
    app: alisio
data:
  alisio.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "loopback",
        "port": 40705,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.alisio/workspace"
        },
        "list": [
          {
            "id": "default",
            "name": "Alisio Assistant",
            "workspace": "~/.alisio/workspace"
          }
        ]
      },
      "cron": { "enabled": false }
    }
  AGENTS.md: |
    # Alisio Assistant

    You are a helpful AI assistant running in Kubernetes.
