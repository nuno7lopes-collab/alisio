<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alisio</title>
    <meta name="application-name" content="Alisio" />
    <meta name="apple-mobile-web-app-title" content="Alisio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07111D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      window.__ALISIO_CONTROL_UI_DEV_GATEWAY_PORT__ =
        "__ALISIO_CONTROL_UI_DEV_GATEWAY_PORT__";
    </script>
    <script>
      (function () {
        var DEFAULT_THEME_FAMILY = "mood";
        var DEFAULT_THEME_MODE = "system";
        var DEFAULT_THEME_ACCENTS = {
          mood: "#F0B56F",
          noir: "#8B5CF6",
          matte: "#B47840",
        };
        var THEME_FAMILY_ALIASES = {
          mood: "mood",
          noir: "noir",
          matte: "matte",
          claw: "mood",
          knot: "noir",
          dash: "matte",
        };
        var THEME_MODE_SET = { system: 1, light: 1, dark: 1 };
        var THEME_ACCENT_TUNING = {
          mood: {
            dark: {
              hoverTarget: "#FFFFFF",
              hoverMix: 0.12,
              subtleAlpha: 0.09,
              glowAlpha: 0.16,
              focusAlpha: 0.18,
              darkForeground: "#14110D",
            },
            light: {
              hoverTarget: "#FFFFFF",
              hoverMix: 0.1,
              subtleAlpha: 0.08,
              glowAlpha: 0.12,
              focusAlpha: 0.15,
              darkForeground: "#14110D",
            },
          },
          noir: {
            dark: {
              hoverTarget: "#FFFFFF",
              hoverMix: 0.12,
              subtleAlpha: 0.14,
              glowAlpha: 0.26,
              focusAlpha: 0.22,
              darkForeground: "#14110D",
            },
            light: {
              hoverTarget: "#000000",
              hoverMix: 0.16,
              subtleAlpha: 0.08,
              glowAlpha: 0.12,
              focusAlpha: 0.16,
              darkForeground: "#14110D",
            },
          },
          matte: {
            dark: {
              hoverTarget: "#FFFFFF",
              hoverMix: 0.12,
              subtleAlpha: 0.16,
              glowAlpha: 0.24,
              focusAlpha: 0.2,
              darkForeground: "#1A1210",
            },
            light: {
              hoverTarget: "#000000",
              hoverMix: 0.16,
              subtleAlpha: 0.12,
              glowAlpha: 0.16,
              focusAlpha: 0.16,
              darkForeground: "#1A1210",
            },
          },
        };
        function normalizeThemeFamily(value) {
          if (typeof value !== "string") return "";
          var normalized = value.trim().toLowerCase();
          return THEME_FAMILY_ALIASES[normalized] || "";
        }
        function normalizeThemeMode(value) {
          if (typeof value !== "string") return "";
          var normalized = value.trim().toLowerCase();
          return THEME_MODE_SET[normalized] ? normalized : "";
        }
        function normalizeHexColor(value, fallback) {
          if (typeof value !== "string") return fallback;
          var trimmed = value.trim();
          if (/^#[0-9a-f]{6}$/i.test(trimmed)) return trimmed.toUpperCase();
          var short = /^#([0-9a-f]{3})$/i.exec(trimmed);
          if (!short) return fallback;
          return (
            "#" +
            short[1]
              .split("")
              .map(function (part) {
                return part + part;
              })
              .join("")
              .toUpperCase()
          );
        }
        function normalizeThemeAccents(value) {
          var raw = value && typeof value === "object" && !Array.isArray(value) ? value : {};
          return {
            mood: normalizeHexColor(raw.mood || raw.claw, DEFAULT_THEME_ACCENTS.mood),
            noir: normalizeHexColor(raw.noir || raw.knot, DEFAULT_THEME_ACCENTS.noir),
            matte: normalizeHexColor(raw.matte || raw.dash, DEFAULT_THEME_ACCENTS.matte),
          };
        }
        function parseSelection(value) {
          var legacyTheme = value && value.theme;
          return {
            themeFamily:
              normalizeThemeFamily(value && value.themeFamily) ||
              normalizeThemeFamily(legacyTheme) ||
              DEFAULT_THEME_FAMILY,
            themeMode:
              normalizeThemeMode(value && value.themeMode) ||
              normalizeThemeMode(legacyTheme) ||
              DEFAULT_THEME_MODE,
            themeAccents: normalizeThemeAccents(value && value.themeAccents),
          };
        }
        function hexToRgb(hex) {
          var normalized = normalizeHexColor(hex, "#000000");
          return {
            r: parseInt(normalized.slice(1, 3), 16),
            g: parseInt(normalized.slice(3, 5), 16),
            b: parseInt(normalized.slice(5, 7), 16),
          };
        }
        function rgbToHex(rgb) {
          return (
            "#" +
            [rgb.r, rgb.g, rgb.b]
              .map(function (value) {
                var bounded = Math.max(0, Math.min(255, Math.round(value)));
                return bounded.toString(16).padStart(2, "0");
              })
              .join("")
              .toUpperCase()
          );
        }
        function rgba(rgb, alpha) {
          return (
            "rgba(" +
            Math.round(rgb.r) +
            ", " +
            Math.round(rgb.g) +
            ", " +
            Math.round(rgb.b) +
            ", " +
            alpha.toFixed(3).replace(/0+$/, "").replace(/\.$/, "") +
            ")"
          );
        }
        function mixRgb(base, target, amount) {
          return {
            r: base.r + (target.r - base.r) * amount,
            g: base.g + (target.g - base.g) * amount,
            b: base.b + (target.b - base.b) * amount,
          };
        }
        function relativeLuminance(rgb) {
          function linearize(channel) {
            var srgb = channel / 255;
            return srgb <= 0.04045 ? srgb / 12.92 : Math.pow((srgb + 0.055) / 1.055, 2.4);
          }
          return (
            0.2126 * linearize(rgb.r) + 0.7152 * linearize(rgb.g) + 0.0722 * linearize(rgb.b)
          );
        }
        function contrastRatio(a, b) {
          var lighter = Math.max(relativeLuminance(a), relativeLuminance(b));
          var darker = Math.min(relativeLuminance(a), relativeLuminance(b));
          return (lighter + 0.05) / (darker + 0.05);
        }
        function ensureAccentContrast(accentHex, mode) {
          var accent = hexToRgb(accentHex);
          var background = hexToRgb(mode === "light" ? "#F4F5F6" : "#171717");
          if (contrastRatio(accent, background) >= 4.5) {
            return rgbToHex(accent);
          }
          var target = hexToRgb(mode === "light" ? "#111111" : "#FFFFFF");
          var low = 0;
          var high = 1;
          var best = target;
          for (var index = 0; index < 20; index += 1) {
            var mid = (low + high) / 2;
            var candidate = mixRgb(accent, target, mid);
            if (contrastRatio(candidate, background) >= 4.5) {
              best = candidate;
              high = mid;
            } else {
              low = mid;
            }
          }
          return rgbToHex(best);
        }
        function resolveAccentForeground(accentHex, darkForeground) {
          var accent = hexToRgb(accentHex);
          var dark = hexToRgb(darkForeground);
          var light = hexToRgb("#FFFFFF");
          return contrastRatio(accent, dark) >= contrastRatio(accent, light)
            ? rgbToHex(dark)
            : "#FFFFFF";
        }
        function applyAccentVariables(root, resolved, accents) {
          var parts = resolved.split("-");
          var family = parts[0];
          var mode = parts[1] === "light" ? "light" : "dark";
          var tuning = THEME_ACCENT_TUNING[family][mode];
          var accent = ensureAccentContrast(accents[family], mode);
          var accentRgb = hexToRgb(accent);
          var hoverRgb = mixRgb(accentRgb, hexToRgb(tuning.hoverTarget), tuning.hoverMix);
          var foreground = resolveAccentForeground(accent, tuning.darkForeground);
          root.style.setProperty("--accent", accent);
          root.style.setProperty("--accent-hover", rgbToHex(hoverRgb));
          root.style.setProperty("--accent-muted", accent);
          root.style.setProperty("--accent-subtle", rgba(accentRgb, tuning.subtleAlpha));
          root.style.setProperty("--accent-foreground", foreground);
          root.style.setProperty("--accent-glow", rgba(accentRgb, tuning.glowAlpha));
          root.style.setProperty("--primary", accent);
          root.style.setProperty("--primary-foreground", foreground);
          root.style.setProperty("--ring", accent);
          root.style.setProperty("--focus", rgba(accentRgb, tuning.focusAlpha));
        }
        var selection = parseSelection({});
        try {
          var keys = Object.keys(localStorage);
          var raw;
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf("alisio.control.settings.v2") === 0) {
              raw = localStorage.getItem(keys[i]);
              if (raw) break;
            }
          }
          if (raw) {
            selection = parseSelection(JSON.parse(raw));
          }
        } catch (e) {}
        var resolvedMode =
          selection.themeMode === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : selection.themeMode;
        var resolved = selection.themeFamily + "-" + resolvedMode;
        var root = document.documentElement;
        root.setAttribute("data-theme", resolved);
        root.setAttribute("data-theme-family", selection.themeFamily);
        root.setAttribute("data-theme-mode", resolvedMode);
        root.style.colorScheme = resolvedMode;
        applyAccentVariables(root, resolved, selection.themeAccents);
      })();
    </script>
  </head>
  <body>
    <alisio-app></alisio-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
