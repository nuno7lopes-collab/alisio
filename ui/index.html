<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alisio</title>
    <meta name="application-name" content="Alisio" />
    <meta name="apple-mobile-web-app-title" content="Alisio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07111D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      window.__ALISIO_CONTROL_UI_DEV_GATEWAY_PORT__ =
        "__ALISIO_CONTROL_UI_DEV_GATEWAY_PORT__";
    </script>
    <script>
      (function () {
        var THEMES = { claw: 1, knot: 1, dash: 1 };
        var MODES = { system: 1, light: 1, dark: 1 };
        try {
          var keys = Object.keys(localStorage);
          var raw;
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf("alisio.control.settings.v2") === 0) {
              raw = localStorage.getItem(keys[i]);
              if (raw) break;
            }
          }
          if (!raw) return;
          var s = JSON.parse(raw);
          var t = s && s.theme;
          var m = s && s.themeMode;
          if (typeof t !== "string") t = "";
          if (typeof m !== "string") m = "";
          var theme = THEMES[t] ? t : "claw";
          var mode = MODES[m] ? m : "system";
          if (mode === "system") {
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var resolved =
            theme === "knot"
              ? mode === "light"
                ? "openknot-light"
                : "openknot"
              : theme === "dash"
                ? mode === "light"
                  ? "dash-light"
                  : "dash"
                : mode === "light"
                  ? "light"
                  : "dark";
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.setAttribute(
            "data-theme-mode",
            resolved.indexOf("light") !== -1 ? "light" : "dark",
          );
          document.documentElement.style.colorScheme =
            resolved.indexOf("light") !== -1 ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <alisio-app></alisio-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
