services:
  - type: web
    name: alisio
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ALISIO_GATEWAY_PORT
        value: "8080"
      - key: ALISIO_STATE_DIR
        value: /data/.alisio
      - key: ALISIO_WORKSPACE_DIR
        value: /data/workspace
      - key: ALISIO_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: alisio-data
      mountPath: /data
      sizeGB: 1
