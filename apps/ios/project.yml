name: Alisio
options:
  bundleIdPrefix: ai.alisio
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  AlisioKit:
    path: ../shared/AlisioKit
  Swabble:
    path: ../../Swabble

schemes:
  Alisio:
    shared: true
    build:
      targets:
        Alisio: all
    test:
      targets:
        - AlisioTests
        - AlisioLogicTests
  AlisioLogicTests:
    shared: true
    build:
      targets:
        AlisioLogicTests: all
    test:
      targets:
        - AlisioLogicTests

targets:
  Alisio:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: AlisioShareExtension
        embed: true
      - target: AlisioActivityWidget
        embed: true
      - target: AlisioWatchApp
      - package: AlisioKit
      - package: AlisioKit
        product: AlisioChatUI
      - package: AlisioKit
        product: AlisioProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../.swiftformat" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/Alisio.entitlements
        CODE_SIGN_STYLE: "$(ALISIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALISIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALISIO_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ALISIO_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ALISIO_PUSH_TRANSPORT: direct
          ALISIO_PUSH_DISTRIBUTION: local
          ALISIO_PUSH_RELAY_BASE_URL: ""
          ALISIO_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          ALISIO_PUSH_TRANSPORT: direct
          ALISIO_PUSH_DISTRIBUTION: local
          ALISIO_PUSH_RELAY_BASE_URL: ""
          ALISIO_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Alisio
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.alisio.ios
            CFBundleURLSchemes:
              - alisio
        CFBundleShortVersionString: "$(ALISIO_MARKETING_VERSION)"
        CFBundleVersion: "$(ALISIO_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.alisio.ios.bgrefresh
        NSLocalNetworkUsageDescription: Alisio discovers and connects to your Alisio gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _alisio-gw._tcp
        NSCameraUsageDescription: Alisio can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: Alisio uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Alisio can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Alisio needs microphone access for voice wake.
        NSMotionUsageDescription: Alisio may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: Alisio needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: Alisio uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        AlisioPushTransport: "$(ALISIO_PUSH_TRANSPORT)"
        AlisioPushDistribution: "$(ALISIO_PUSH_DISTRIBUTION)"
        AlisioPushRelayBaseURL: "$(ALISIO_PUSH_RELAY_BASE_URL)"
        AlisioPushAPNsEnvironment: "$(ALISIO_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  AlisioShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: AlisioKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALISIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALISIO_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALISIO_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ALISIO_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Alisio Share
        CFBundleShortVersionString: "$(ALISIO_MARKETING_VERSION)"
        CFBundleVersion: "$(ALISIO_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  AlisioActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/AlisioActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALISIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALISIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALISIO_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Alisio Activity
        CFBundleShortVersionString: "$(ALISIO_MARKETING_VERSION)"
        CFBundleVersion: "$(ALISIO_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AlisioWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: AlisioWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALISIO_WATCH_APP_BUNDLE_ID)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Alisio
        CFBundleShortVersionString: "$(ALISIO_MARKETING_VERSION)"
        CFBundleVersion: "$(ALISIO_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(ALISIO_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  AlisioWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALISIO_WATCH_EXTENSION_BUNDLE_ID)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: Alisio
        CFBundleShortVersionString: "$(ALISIO_MARKETING_VERSION)"
        CFBundleVersion: "$(ALISIO_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(ALISIO_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  AlisioTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: Alisio
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALISIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALISIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.alisio.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Alisio.app/Alisio"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: AlisioTests
        CFBundleShortVersionString: "$(ALISIO_MARKETING_VERSION)"
        CFBundleVersion: "$(ALISIO_BUILD_VERSION)"

  AlisioLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: AlisioKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALISIO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALISIO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.alisio.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: AlisioLogicTests
        CFBundleShortVersionString: "$(ALISIO_MARKETING_VERSION)"
        CFBundleVersion: "$(ALISIO_BUILD_VERSION)"
