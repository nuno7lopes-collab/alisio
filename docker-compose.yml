services:
  alisio-gateway:
    image: ${ALISIO_IMAGE:-alisio:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      ALISIO_GATEWAY_TOKEN: ${ALISIO_GATEWAY_TOKEN:-}
      ALISIO_ALLOW_INSECURE_PRIVATE_WS: ${ALISIO_ALLOW_INSECURE_PRIVATE_WS:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${ALISIO_TZ:-UTC}
    volumes:
      - ${ALISIO_CONFIG_DIR}:/home/node/.alisio
      - ${ALISIO_WORKSPACE_DIR}:/home/node/.alisio/workspace
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg ALISIO_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with ALISIO_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    ports:
      - "${ALISIO_GATEWAY_PORT:-40705}:40705"
      - "${ALISIO_BRIDGE_PORT:-40706}:40706"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${ALISIO_GATEWAY_BIND:-lan}",
        "--port",
        "40705",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:40705/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  alisio-cli:
    image: ${ALISIO_IMAGE:-alisio:local}
    network_mode: "service:alisio-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      ALISIO_GATEWAY_TOKEN: ${ALISIO_GATEWAY_TOKEN:-}
      ALISIO_ALLOW_INSECURE_PRIVATE_WS: ${ALISIO_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${ALISIO_TZ:-UTC}
    volumes:
      - ${ALISIO_CONFIG_DIR}:/home/node/.alisio
      - ${ALISIO_WORKSPACE_DIR}:/home/node/.alisio/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - alisio-gateway
